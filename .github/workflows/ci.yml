name: CI

# Builds, vets, and tests every module, keeps the two UGREEN cross-compile
# targets honest with a real compile check, and enforces the
# core/apps/ui-shared repository-structure boundary
# (docs/EPIC-B-multi-nas.md §7.1, landed in #106/B1.1). rclone's dependency
# graph is heavy (roughly 1.7GB and 260+ modules to resolve, see
# docs/rclone-upgrade.md), so the Go module and build caches are
# load-bearing here, not a nice-to-have.
#
# WHEN THIS RUNS, AND WHY IT IS NOT EVERYWHERE (issue #575)
#
# On a pull request into `release`, and on demand from the Actions tab.
# Nothing else. A pull request into `main` still gates on
# scripts/ci-local.sh, which mirrors every job below and runs from
# .husky/pre-commit on every commit; see that script's header for why that
# is the arrangement.
#
# `release` is the exception because merging into it PUBLISHES.
# .github/workflows/release.yml triggers on the push, builds the canonical
# multi-architecture image, signs it keylessly and pushes it to a public
# registry, and it runs no test suite of its own: it proves the compliance
# artifacts and the manifest parity, which is a different question from
# whether the code works. So until this trigger existed, the only thing
# standing between a bad change and a signed public release was somebody
# running the local gate and remembering to read the last line. That is
# the same "a person remembers" shape this project has spent a lot of
# effort removing from the product, sitting on the one branch where the
# mistake cannot be taken back.
#
# The `release gate` job at the bottom is the single check to point branch
# protection at. It fails unless every job here succeeded, so a job that
# is red, skipped or cancelled all block the merge, and
# scripts/tests/release-gate-covers-every-job.test.sh keeps its `needs`
# list from falling behind the jobs it is supposed to cover.

on:
  pull_request:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-build-vet-test:
    name: core/ build, vet, test
    runs-on: ubuntu-latest
    # GOWORK=off: prove core/'s own go.mod stands alone, independent of the
    # repo-root go.work (which also lists ./apps/common for local
    # multi-module development convenience) — "provider-neutral core is
    # independently buildable/testable" (#106 acceptance criteria).
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # TestShippedMigrationsMatchWhatWasPublished (#396) anchors every
          # shipped migration to the bytes origin/release published, because
          # a checksum table living beside the files it describes can be
          # edited in step with them and the whole suite still goes green. A
          # default single-commit shallow clone carries no remote branches
          # and no tags, so origin/release is not there to ask, and that test
          # refuses rather than passing on a check it could not run. Full
          # history is what gives it something to anchor to.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          # actions/setup-go caches ~/go/pkg/mod and the build cache, keyed
          # on go.sum. Without this a cold resolve of rclone's module graph
          # takes over 6 minutes on every single run.
          cache: true
          cache-dependency-path: core/go.sum

      - name: Build
        working-directory: core
        run: go build ./...

      - name: Vet
        working-directory: core
        run: go vet ./...

      - name: Test
        working-directory: core
        # -race, the same as scripts/ci-local.sh's own step for this
        # module (#417). This workflow is workflow_dispatch-only and that
        # script is the gate that actually runs, but the script's whole
        # claim is that it mirrors this file job for job, and a mirror
        # that runs a weaker check than the thing it mirrors is worse
        # than no mirror.
        run: go test -race ./...

  apps-common-build-vet-test:
    name: apps/common build, vet, test
    runs-on: ubuntu-latest
    # GOWORK=off, matching core-build-vet-test above: apps/common/go.mod
    # has no dependencies today, so this is a no-op right now, but
    # apps/common/webhost is the deliberate seam for #94, which WILL need
    # to import core/. Left on, GOWORK would let go.work's `use` directives
    # silently substitute the local core/ directory regardless of whether
    # apps/common/go.mod's own module pin is even correct — exactly the
    # module-boundary illusion this repo's dependency-rules job exists to
    # prevent elsewhere. Fixing it now, while it changes nothing observable,
    # is cheaper than fixing it once something actually depends on it.
    env:
      GOWORK: "off"
    steps:
      # The default shallow clone. This job used to take a full one for
      # packaging's release-manifest checks, and packaging has not lived
      # here since #165 moved it into its own module: the comment outlived
      # the code it described, and the job that inherited those checks
      # (distribution, below) inherited a shallow clone with them. Nothing
      # under apps/common asks git anything.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: apps/common/go.mod

      - name: Build
        working-directory: apps/common
        run: go build ./...

      - name: Vet
        working-directory: apps/common
        run: go vet ./...

      - name: Test
        working-directory: apps/common
        # -race, as in scripts/ci-local.sh's step for this module (#417).
        run: go test -race ./...

  distribution-build-vet-test:
    name: distribution build, vet, test
    runs-on: ubuntu-latest
    # The distribution layer's own module (issue #165). It used to be
    # apps/common/packaging, inside the module that also holds the /api/v1
    # host and the shared authentication service, which meant the layer
    # boundary between "shared application code" and "packaging metadata"
    # was a directory name. It is a module now, so the dependency direction
    # EPIC B #81 requires (core/app never depends on distribution) is
    # enforced by the module graph rather than only by a scanner.
    #
    # This job carries Phase 4's cross-provider conformance suite, including
    # the per-capability matrix with its completeness and staleness guards,
    # so it is load-bearing rather than a formality.
    #
    # GOWORK=off, matching every other module job: distribution/go.mod
    # depends on nothing in this repository, and that is a claim worth
    # holding it to rather than letting go.work paper over.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # packaging's release-manifest checks ask git whether the commit
          # container/release-manifest.json pins is an ancestor of HEAD
          # (#174), and TestReleaseManifestPinsACommitThisHistoryCanReach
          # asks it of origin/main and origin/release by name. In
          # actions/checkout's default single-commit shallow clone that
          # commit is not an object at all and those refs do not exist, so
          # git exits 128 and every one of the ten provider rows in the
          # conformance matrix fails with "could not decide". Full history
          # is what makes the question answerable.
          #
          # This sat on apps/common until #575, which is where packaging
          # lived before #165 moved it into this module. Nothing noticed
          # because no pull request had ever run this workflow.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: distribution/go.mod

      - name: Build
        working-directory: distribution
        run: go build ./...

      - name: Vet
        working-directory: distribution
        run: go vet ./...

      - name: Test
        working-directory: distribution
        # Every package but packaging under -race, and packaging without
        # it, exactly as scripts/ci-local.sh splits the same module
        # (#417): packaging is a static-analysis suite with no goroutine
        # anywhere in it, so the detector has nothing to find there and
        # multiplies the most CPU-bound package in the repository.
        run: |
          go test -race $(go list ./... | grep -v '/packaging$')
          go test ./packaging/

  apps-generic-build-vet-test:
    name: apps/generic build, vet, test
    runs-on: ubuntu-latest
    # GOWORK=off, matching apps-common-build-vet-test above: apps/generic
    # is the generic Web host's own binary (issue #82/B4.1), wiring
    # core/service + apps/common/webhost + apps/common/auth/local
    # together — its own go.mod's replace directives, not go.work's `use`
    # list, are what have to resolve correctly here.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: apps/generic/go.mod

      - name: Build
        working-directory: apps/generic
        run: go build ./...

      - name: Vet
        working-directory: apps/generic
        run: go vet ./...

      - name: Test
        working-directory: apps/generic
        # -race, as in scripts/ci-local.sh's step for this module (#417).
        run: go test -race ./...

  apps-synology-build-vet-test:
    name: apps/synology build, vet, test
    runs-on: ubuntu-latest
    # GOWORK=off, matching every other module job: apps/synology has no
    # dependencies at all (see its go.mod's own comment) and must keep
    # not having any — it ships no Go binary into the package, only the
    # machinery that wraps the release binaries and checks them, so a
    # dependency appearing here would mean something Synology-specific
    # had started linking against core/ or apps/common.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: apps/synology/go.mod

      - name: Build
        working-directory: apps/synology
        run: go build ./...

      - name: Vet
        working-directory: apps/synology
        run: go vet ./...

      # This is where the SPK conformance suite runs: the
      # documented-layout check, the INFO field check, the bundled-secret
      # scan, the unsafe-delete scan over the shipped lifecycle scripts,
      # and the binary-hash parity check (§3.7) exercised against
      # synthetic fixtures.
      #
      # Synthetic, and worth being exact about: nothing in this job
      # cross-compiles the release binaries, builds a .spk, or runs
      # `spkctl verify` against container/release-manifest.json. Every
      # test packs binaries it synthesised itself and checks them against
      # a manifest hashed from those same files, so what is proven here is
      # that the packer and the verifier agree, not that any package
      # carries the release digest. Parity against a real artifact is
      # blocked on #174 and is checked by hand in
      # docs/acceptance/synology-dsm-package-lifecycle.md step 1.6.
      - name: Test
        working-directory: apps/synology
        # -race, as in scripts/ci-local.sh's step for this module (#417).
        run: go test -race ./...

  ugreen-cross-compile:
    name: UGREEN cross-compile (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: core/go.sum

      # This is a compile check, not a smoke test: it proves the UGREEN
      # target still cross-compiles with CGO disabled. It does not run the
      # resulting binary, since the runner's architecture usually does not
      # match the target's.
      #
      # It builds ./... rather than just ./cmd/backup-manager on purpose. The
      # narrower form only compiles what the binary transitively imports, so a
      # package nobody has wired up yet is never cross-compiled at all, and an
      # architecture-specific mistake in it sits undetected until the day it
      # gets imported. internal/capacity found this the hard way: it wraps
      # statfs, whose struct field widths differ between amd64 and arm64, and
      # the job here would have passed regardless because cmd/ does not import
      # it yet.
      - name: Compile everything for linux/${{ matrix.goarch }}, CGO_ENABLED=0
        working-directory: core
        run: go build ./...

      # The canonical runtime's OTHER half (issue #167). core/ alone proves
      # the engine library cross-compiles; it says nothing about the binary
      # that actually carries `serve`, `serve-ui` and the runtime-profile
      # selector, which lives in apps/generic and is a different module with
      # a different dependency set. "The same source revision produces
      # linux/amd64 and linux/arm64" is a claim about the whole image, so
      # both modules have to hold for both architectures.
      - name: Compile the web host for linux/${{ matrix.goarch }}, CGO_ENABLED=0
        working-directory: apps/generic
        run: go build ./...

  frontend:
    name: ui/shared typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/shared/package-lock.json

      # npm ci needs a lockfile. Until one is committed, fall back to install
      # so the job still gates on typecheck and tests rather than being
      # skipped, and say so out loud rather than silently degrading.
      - name: Install
        working-directory: ui/shared
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::ui/shared has no package-lock.json, falling back to npm install (builds are not reproducible until one is committed)"
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        working-directory: ui/shared
        run: npm run lint

      - name: Typecheck every provider frontend
        working-directory: ui/shared
        run: npm run typecheck:providers

      - name: Test
        working-directory: ui/shared
        run: npm test

      # A build is the only thing that proves the Vite entry and the provider
      # alias actually resolve, which typecheck alone does not. Also proves,
      # on every run, that this succeeds with only apps/generic present (see
      # dependency-rules' verify-ui-shared-without-provider-sdks.sh for the
      # literal every-other-provider-deleted version of this same claim).
      - name: Build
        working-directory: ui/shared
        run: npm run build

  provider-conformance:
    name: cross-provider conformance suite (apps/common/tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/common/tests/package-lock.json

      - name: Install
        working-directory: apps/common/tests
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::apps/common/tests has no package-lock.json, falling back to npm install"
            npm install --no-audit --no-fund
          fi

      # This suite is the one place in the repo that legitimately imports
      # every provider's frontend bridge (§63A — the provider conformance
      # matrix). It lives outside ui/shared specifically so removing a
      # provider app never breaks ui/shared's own build or test run; see
      # dependency-rules below for that claim proven by actual deletion.
      - name: Test
        working-directory: apps/common/tests
        run: npm test

  gofmt:
    name: every tracked Go file is gofmt-clean (#417)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      # Its own job rather than a step inside a module's, because it is not
      # a module's question. It reads every tracked .go file in the
      # repository, which is the only thing that reaches the two that live
      # outside every module and outside go.work
      # (scripts/api/gen-bindings.go, scripts/architecture/ownership.go).
      # One of those two was the unformatted one that started #417's
      # formatting half. Half a second on the whole repository.
      - name: gofmt sweep
        run: bash scripts/format/check-gofmt.sh

      # scripts/format/selftest.sh is deliberately NOT here, and that is a
      # statement about this job rather than about the check. It needs
      # golangci-lint, this job installs none, and per-module linting still
      # lives entirely in scripts/ci-local.sh, which runs it on every
      # non-FAST run.
      #
      # The dependency-rules job below does install golangci-lint now,
      # because scripts/architecture/selftest.sh cannot exercise
      # check-unowned-go.sh without it and was reporting three broken
      # controls instead of a missing binary (#575). That is one control
      # needing one tool, not this workflow taking on the linting the local
      # gate does.

  api-contract:
    name: /api/v1 contract drift (#166)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # selftest.sh copies the working tree into throwaway git
          # repositories and runs `go test` in them; it needs real history
          # no more than the copy does, but the drift check itself resolves
          # the repository root through git, so a usable clone is required.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: core/go.sum

      - name: git config (the self-test commits into throwaway repositories)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      # The drift gate proper: api/v1/openapi.json is authoritative, and
      # both checked-in bindings have to be exactly what it generates.
      # Nothing here builds the JavaScript workspace, deliberately: the
      # TypeScript binding is generated by the same Go program as the Go
      # one, so its drift is caught with no npm install at all. What the
      # frontend job adds on top is whether ui/shared actually CONSUMES the
      # generated module (contract.conformance.test.ts), which is a
      # different question.
      - name: the generated Go and TypeScript bindings match the contract
        run: bash scripts/api/check-contract-drift.sh

      - name: the contract gates can actually fail (mutation self-test)
        run: bash scripts/api/selftest.sh

  dependency-rules:
    name: repository-structure dependency rules (§7.1, three layers per #165)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The verify-*.sh scripts create a throwaway `git worktree` of
          # HEAD and delete a directory in it; that needs real git history,
          # not actions/checkout's default single-commit shallow clone.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: core/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/shared/package-lock.json

      - name: git config (worktree commits need an identity)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      # scripts/architecture/selftest.sh exercises check-unowned-go.sh,
      # which lints the two Go files that live outside every module by
      # copying each into a throwaway module and running golangci-lint
      # there. Without the binary that control does not report "the linter
      # is missing": it reports the check failing on an unmutated tree,
      # which is the selftest correctly refusing to trust a control it
      # could not run, and it took three of the thirty-eight architecture
      # controls down with it the first time a pull request ever ran this
      # workflow (#575).
      #
      # Built rather than downloaded, so the version is pinned in this
      # file and needs no third-party action and no piped installer. It is
      # the version scripts/ci-local.sh runs against on the machine this
      # gate mirrors; the two agreeing is the whole reason either is worth
      # reading. Under a minute against setup-go's warm module cache.
      - name: Install golangci-lint (the version the local gate runs)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      # The three-layer manifest (issue #165) comes first: every check
      # below reads it to decide which layer a path is in, so a hole in it
      # would make all of them fail open.
      - name: every tracked file is classified into a layer
        run: bash scripts/architecture/check-layer-manifest.sh

      - name: architecture rules can actually fail (mutation self-test)
        run: bash scripts/architecture/selftest.sh

      - name: the release-manifest generator still refuses what #174 needs it to
        run: bash scripts/tests/record-release-hashes-guards.test.sh

      - name: core/app imports neither platform, distribution nor a NAS SDK (static check)
        run: bash scripts/architecture/check-core-dependency-rule.sh

      - name: no runtime-platform or distribution package owns a core concept
        run: bash scripts/architecture/check-layer-ownership.sh

      - name: the shared UI imports no provider SDK (full Phase 6 platform list)
        run: bash scripts/architecture/check-ui-shared-provider-imports.sh

      - name: core/ builds and tests with apps/ deleted entirely
        run: bash scripts/architecture/verify-core-without-apps.sh

      - name: core and the generic application build and test with the distribution adapter tree deleted
        run: bash scripts/architecture/verify-core-without-distribution.sh

      - name: ui/shared builds with every provider SDK directory removed
        run: bash scripts/architecture/verify-ui-shared-without-provider-sdks.sh

      - name: apps/ugos/ is removable without breaking core or ui/shared
        run: bash scripts/architecture/verify-ugos-removable.sh

      # The performance gate's presence half only (issue #165). It takes no
      # measurements, so it is safe on a shared runner; compare mode is
      # deliberately not here, because EPIC B #81 allows the measurements to
      # run on a dedicated benchmark environment rather than blocking
      # ordinary CI on noisy numbers.
      - name: a complete performance baseline is checked in for the designated host
        run: bash scripts/perf/check-baseline.sh

      - name: the performance gate can actually fail (mutation self-test)
        run: bash scripts/perf/selftest.sh

  gate-guards:
    name: the release gate's own guards (#575)
    runs-on: ubuntu-latest
    # A gate that cannot be checked is a gate nobody can trust, and both
    # things checked here are the kind that fail silently and in the
    # dangerous direction: a needs list that fell behind the jobs it
    # covers, and a workflow step that read "this runner could not perform
    # the proof" as nothing to report. Both are seconds of shell with no
    # Docker and no toolchain, so they run in their own job rather than
    # being tucked into one whose name describes something else.
    #
    # They run in scripts/ci-local.sh too, on every commit through
    # .husky/pre-commit, which is where a change to this file would
    # normally be caught. Here as well, because "normally" is doing a lot
    # of work in that sentence on the one branch where a mistake ships.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: the release gate still covers every job in this workflow
        run: bash scripts/tests/release-gate-covers-every-job.test.sh

      - name: a proof this runner could not perform still reads as incomplete
        run: bash scripts/tests/two-machine-ci-verdict.test.sh

      - name: the proof's own verdict is still a number nothing else produces (#551)
        run: bash scripts/tests/two-machine-exit-status.test.sh

  two-machine-e2e:
    name: two machines, one temporary network, one real backup (#356)
    runs-on: ubuntu-latest
    # Generous on purpose. The image under test is built from this tree
    # (Go binaries plus the UI bundle) on a cold Docker cache, and then
    # four cases each stand up a docker-in-docker machine, load that image
    # into its inner daemon, run the real installer and pull a real
    # backup. A run that overruns should say so as a timeout naming this
    # job rather than as a six-hour Actions default nobody is watching.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Asked before anything expensive runs, and kept afterwards rather
      # than deleted once the answer was known. When this job reports
      # INCOMPLETE the first question is what the runner had, and the
      # honest place to answer it is the run that could not perform the
      # proof, not a scratch branch six months later.
      #
      # Disk is the one worth being explicit about. The installer refuses
      # below 2048 MiB free on the filesystem holding the deployment, and
      # that refusal has already fired on a developer machine with 300 GB
      # free because the Docker VM's own disk was full. Here the
      # deployment lives inside a docker-in-docker container, so what
      # matters is the runner's Docker data root, not the checkout's
      # filesystem.
      - name: What this runner has
        run: |
          echo "## Runner capability" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          {
            echo "kernel:  $(uname -sr)"
            echo "cpus:    $(nproc)"
            echo "memory:"
            free -h || true
            echo "disk:"
            df -h / /var/lib/docker 2>/dev/null || df -h /
            echo "docker:  $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unreachable)"
            echo "docker data root: $(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo unknown)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"

          # The two capabilities the proof refuses without, probed here so
          # the answer is legible even when the proof's own preflight says
          # the same thing forty lines further down. Neither is fatal in
          # this step: the proof is what decides, and a probe that
          # disagreed with it would be a second opinion nobody asked for.
          if docker run --rm --privileged docker:28-dind true >/dev/null 2>&1; then
            echo "privileged containers: allowed, so docker-in-docker can start"
          else
            echo "privileged containers: REFUSED, so the manager machine cannot be a machine"
          fi
          # connlimit is what the connection-cap case installs inside the
          # source container to model #264's production rule. It is a
          # kernel module, so a runner can have iptables and still not
          # carry it.
          if sudo modprobe xt_connlimit >/dev/null 2>&1; then
            echo "xt_connlimit: loadable, so the connection-cap case can impose #264's rule"
          else
            echo "xt_connlimit: not loadable by name (it may still be built in; the case proves the cap bites before trusting it)"
          fi

      # All four cases, not a subset, and one invocation rather than a
      # matrix. `release` moves a handful of times a year, so the argument
      # for trimming is weak, and each case covers a claim a release makes
      # that no other case covers: plain is the path itself, no-arguments
      # is the zero-flag install where the installer's own --image default
      # decides what gets installed (#347, #346, and #342's shape, which
      # is precisely a stale default pointing at a published release),
      # connection-cap is the transport bug that actually broke on real
      # hardware (#264), and lifecycle is upgrade and factory reset, which
      # is the path every existing operator takes on the day a release
      # ships. A matrix would look tidier and cost four cold builds of the
      # image under test instead of one, because the build is per job and
      # the cases share it.
      #
      # Through scripts/e2e/two-machine-ci.sh rather than calling the
      # proof directly, because the proof has three outcomes and a
      # workflow step has two. That wrapper is the one place the third one
      # is spoken: a runner that could not perform the proof goes red
      # under the word INCOMPLETE instead of green under no word at all.
      - name: Two machines, one temporary network, one real backup
        run: bash scripts/e2e/two-machine-ci.sh --case all

      # What the run cost the disk, on the way out. A case that dies on
      # the installer's 2048 MiB refusal is diagnosed from this line and
      # from the one in the capability step above, and neither is
      # recoverable after the runner is gone.
      - name: What the run cost
        if: always()
        run: |
          df -h / /var/lib/docker 2>/dev/null || df -h /

  release-gate:
    name: release gate
    # The single check to require in branch protection on `release`, and
    # the reason it exists rather than requiring each job by name: a job
    # added to this file later would not be in a hand-maintained list of
    # required contexts, so the gate would quietly stop covering it. Here
    # the list is in the same file as the jobs, and
    # scripts/tests/release-gate-covers-every-job.test.sh fails when the
    # two come apart.
    #
    # always(), because the default `needs` behaviour is to SKIP a job
    # whose dependency failed. A skipped check reports no conclusion at
    # all, which a branch protection rule reads as "not yet run" rather
    # than as a failure, and a required check that never reports is a
    # merge waiting for something that is not coming. This job has to run
    # and go red instead.
    if: always()
    needs:
      - core-build-vet-test
      - apps-common-build-vet-test
      - distribution-build-vet-test
      - apps-generic-build-vet-test
      - apps-synology-build-vet-test
      - ugreen-cross-compile
      - frontend
      - provider-conformance
      - gofmt
      - api-contract
      - dependency-rules
      - gate-guards
      - two-machine-e2e
    runs-on: ubuntu-latest
    steps:
      - name: every job in this workflow succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])

          # A positive control on the input itself. `needs` arriving empty
          # would make every check below pass by having nothing to look
          # at, which is the exact failure this whole issue is about.
          if not needs:
              sys.exit("the needs context is empty, so this gate is reporting on nothing at all")

          bad = sorted((job, r["result"]) for job, r in needs.items() if r["result"] != "success")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = []
          if bad:
              lines.append("## release gate: BLOCKED")
              lines.append("")
              lines.append("These jobs did not succeed:")
              lines.append("")
              for job, result in bad:
                  lines.append(f"- `{job}`: {result}")
              lines.append("")
              lines.append(
                  "A merge into `release` publishes a signed image to a public registry, "
                  "so this gate refuses anything short of every job green. A job reported "
                  "as `skipped` or `cancelled` counts too: neither is a run that proved "
                  "anything."
              )
          else:
              lines.append("## release gate: PASSED")
              lines.append("")
              lines.append(f"All {len(needs)} jobs in this workflow succeeded.")

          text = "\n".join(lines)
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text + "\n")

          if bad:
              print("::error title=release gate::" + ", ".join(f"{j} is {r}" for j, r in bad))
              sys.exit(1)
          PY
