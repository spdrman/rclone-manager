# FR-33's inline-credential refusal, which is a Load-time unknown-field
# error rather than a validation error, because the schema has no field
# for a literal key at all. Not a medium-free config: it is here because
# the refusal it pins is the one thing about mediums an upgraded
# deployment can hit without ever configuring one.
poll_interval: 15m

state:
  database: /var/lib/backup-manager/state.db

sources:
  - id: production
    backup_sets:
      - id: postgres-primary
        remote:
          type: local
        remote_path: /srv/exports/postgres
        local_path: /backups/production/postgres
        completion:
          strategy: stable
          stable_for: 10m
        stale_after: 30h

storage_mediums:
  - id: offsite_s3
    type: s3
    region: us-east-1
    bucket: nas-backups
    access_key_id: AKIAIOSFODNN7EXAMPLE
    secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
