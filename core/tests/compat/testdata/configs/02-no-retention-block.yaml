# The retention block omitted entirely. What it resolves to is the whole
# of #111's regression-safety promise, and EPIC E must not move it.
poll_interval: 15m

state:
  database: /var/lib/backup-manager/state.db

sources:
  - id: production
    backup_sets:
      - id: postgres-primary
        remote:
          type: sftp
          host: production.example.internal
          user: backup
          key_file: /run/secrets/backup_ssh_key
          known_hosts: /etc/backup-manager/known_hosts
        remote_path: /backups/postgres
        local_path: /backups/production/postgres
        completion:
          strategy: stable
          stable_for: 10m
        stale_after: 30h
