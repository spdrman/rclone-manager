# FR-33's planted schema gate. There is no schema field for a literal key,
# so access_key_id and secret_access_key are UNKNOWN fields and Load's
# KnownFields(true) refuses this file before validation ever runs. If this
# file ever loads, a secret has become spellable in config.yaml.
#
# The values are deliberately not key-shaped. What is under test is that
# the FIELD does not exist, so nothing here needs to look like a real
# credential, and a fixture carrying a credential-shaped string is a
# fixture someone eventually copies somewhere it matters.
poll_interval: 15m

state:
  database: /var/lib/backup-manager/state.db

sources:
  - id: production
    backup_sets:
      - id: postgres-primary
        remote:
          type: sftp
          host: production.example.internal
          user: backup
          key_file: /run/secrets/backup_ssh_key
          known_hosts: /etc/backup-manager/known_hosts
        remote_path: /backups/postgres
        local_path: /backups/production/postgres
        completion:
          strategy: stable
          stable_for: 10m
        stale_after: 30h

storage_mediums:
  - id: offsite_s3
    type: s3
    region: us-east-1
    bucket: nas-backups
    access_key_id: not-a-key-the-field-is-the-point
    secret_access_key: not-a-key-the-field-is-the-point
