<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup Manager</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; color: #1f2933; }
  code { background: #eef1f4; padding: 0 .25em; border-radius: 3px; }
</style>
</head>
<body>
<!--
  DSM serves this directory (INFO's dsmuidir) at /webman/3rdparty/BackupManager/,
  and the desktop launcher entry in ./config points here. The application
  itself is not served by DSM's own web server: it is this package's own
  backup-manager-web process, listening on port 8477, so this page's only
  job is to send the browser there on the same host the DSM session is
  already open against.

  Deliberately client-side rather than a CGI redirect: a redirect written
  here would have to run as DSM's web user, and nothing about this package
  needs code executing outside its own package user.
-->
<p id="status">Opening Backup Manager&hellip;</p>
<p id="fallback" hidden>
  If nothing happens, open <code id="target"></code> directly.
</p>
<script>
  (function () {
    var target = window.location.protocol + "//" + window.location.hostname + ":8477/";
    document.getElementById("target").textContent = target;
    document.getElementById("fallback").hidden = false;
    window.location.replace(target);
  })();
</script>
<noscript>
  <p>JavaScript is disabled. Open Backup Manager on port <code>8477</code> of this NAS.</p>
</noscript>
</body>
</html>
