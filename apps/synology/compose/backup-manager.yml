# Synology Container Manager project for Backup Manager (issue #169).
#
# THIS DOES NOT REPLACE THE .spk. apps/synology/spk still builds the DSM
# package #85 shipped, and nothing here deprecates it. What this adds is
# the path EPIC B #81's support table names for Synology: a Container
# Manager project deploying the canonical runtime, so a DSM system can run
# this release without a separate Synology application build. Which one to
# install is a choice, and apps/synology/README.md sets out the trade.
#
# Container Manager -> Project -> Create -> "Create docker-compose.yml",
# paste this file, and paste backup-manager.env into the environment. See
# https://kb.synology.com/en-us/DSM/help/ContainerManager/docker_project
# for the current wording of that flow.
#
# Nothing here is Synology behaviour. It is the same two-container shape
# container/compose.yaml ships, running the same canonical image, with
# `--profile=synology` selecting the platform identity and the UI bridge.
# distribution/packaging derives every runtime field below from that one
# definition and fails the build when any of them drifts.
services:
  # The engine: local authentication, the versioned /api/v1 API and the
  # backup scheduler, one process sharing one shutdown context. It holds
  # the state database and the credentials, and publishes no port at all.
  backup-manager:
    image: ${IMAGE:-ghcr.io/spdrman/backup-manager:1.0.0}
    command: ["/backup-manager-web", "serve", "--profile=synology"]

    user: "${PUID:-1026}:${PGID:-100}"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=${PUID:-1026},gid=${PGID:-100}

    environment:
      TMPDIR: "/tmp"
      TZ: "${TZ:-UTC}"
      LISTEN_ADDR: ":8080"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      # Safe here specifically because this container joins only the
      # project network below, whose only other member is the Web UI
      # container, so a forwarded header can only have come from that
      # proxy. This is the one thing the Container Manager path gets that
      # the .spk cannot: the .spk's engine binds loopback on the NAS
      # itself, which any local process can reach, so it does not trust
      # these headers.
      TRUST_FORWARDED_HEADERS: "true"

    # Fail-closed host paths. Docker creates a missing bind-mount source,
    # so a ${VAR:-default} here would put the backup root on the DSM
    # system volume and report healthy about it.
    volumes:
      - ${APPDATA:?set APPDATA in backup-manager.env to the project directory, e.g. /volume1/docker/backup-manager}/state:/data/state
      - ${BACKUP_ROOT:?set BACKUP_ROOT in backup-manager.env to the shared folder retained artifacts land in}:/data/backups
      # A writable directory holding config.yaml (issue #196): the engine
      # creates and atomically replaces that file, and its ssh_keys/ and
      # known_hosts.d/ stores are siblings of it.
      - ${APPDATA:?set APPDATA in backup-manager.env to the project directory, e.g. /volume1/docker/backup-manager}/config:/etc/backup-manager/config
      - ${APPDATA:?set APPDATA in backup-manager.env to the project directory, e.g. /volume1/docker/backup-manager}/secrets/id_ed25519:/etc/backup-manager/id_ed25519:ro
      - ${APPDATA:?set APPDATA in backup-manager.env to the project directory, e.g. /volume1/docker/backup-manager}/secrets/known_hosts:/etc/backup-manager/known_hosts:ro

    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - internal

  # The Web UI: the shared static bundle plus a reverse proxy to the
  # engine. The only container with a published port, and the only URL an
  # operator ever opens. There is no DSM desktop launcher on this path,
  # which is one of the two things the .spk still does that this does not.
  backup-manager-ui:
    image: ${IMAGE:-ghcr.io/spdrman/backup-manager:1.0.0}
    command: ["/backup-manager-web", "serve-ui", "--profile=synology"]

    depends_on:
      backup-manager:
        condition: service_healthy

    user: "${PUID:-1026}:${PGID:-100}"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=${PUID:-1026},gid=${PGID:-100}

    environment:
      TMPDIR: "/tmp"
      TZ: "${TZ:-UTC}"
      LISTEN_ADDR: ":8080"
      UPSTREAM_ADDR: "http://backup-manager:8080"
      # The per-provider UI bundles the canonical image carries. With the
      # synology profile selected above, the bundle served is
      # /ui/bundles/synology, so an operator who installed through
      # Container Manager sees the Synology bridge rather than being told
      # this is a generic Docker deployment (issue #180).
      UI_ROOT: "/ui/bundles"

    # No volumes at all: this container never reads config.yaml, the SSH
    # key, known_hosts, or either data directory.

    # Overrides the image's own HEALTHCHECK, which runs
    # `/backup-manager status` and needs a config file and a state
    # database this container does not have.
    healthcheck:
      test: ["CMD", "/backup-manager-web", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    ports:
      - "${WEB_PORT:-8080}:8080"

    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - internal

networks:
  internal:
