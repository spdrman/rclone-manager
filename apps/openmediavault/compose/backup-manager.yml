# OpenMediaVault Compose deployment for Backup Manager
# (WP4.3, deliverable D-8).
#
# Paste this into the File field of Services -> Compose -> Files -> Add in
# the OMV Workbench, and backup-manager.env into the Environment field.
#
# Tier C (§4A): a supported deployment profile, not an app-store package.
# There is deliberately no native OMV Workbench plugin, no navigation
# entry, no RPC service and no Debian package. §4A defers all of that, and
# distribution/packaging fails the build if any of it appears here.
#
# Every host path below is ${DISK}/..., so the one substitution an
# operator has to make (their real /srv/dev-disk-by-uuid-<UUID>/ path)
# happens once, in backup-manager.env, and this file needs no editing at
# all. Retained artifacts land in a directory of the app's own inside
# ${DISK}/backups rather than in that directory itself, so installing and
# removing this profile only ever touches paths it created.
#
# This is the same two-container shape container/compose.yaml already
# ships for the generic Docker app, using the exact same canonical image.
# Nothing here is OMV-specific behaviour.
services:
  # The engine: local authentication, the versioned /api/v1 API and the
  # backup scheduler, one process sharing one shutdown context. Holds the
  # state database and the credentials. Publishes no port; reachable only
  # from backup-manager-ui over this project's own network.
  backup-manager:
    image: ${IMAGE:-ghcr.io/spdrman/backup-manager:1.0.0}
    command: ["/backup-manager-web", "serve", "--profile=openmediavault"]

    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=${PUID:-1000},gid=${PGID:-100}

    environment:
      TMPDIR: "/tmp"
      LISTEN_ADDR: ":8080"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      # Safe here specifically because this container joins only the
      # private network below, whose only other member is the Web UI
      # container, so a forwarded header can only have come from that
      # proxy. Never set this on the Web UI container, which is the edge.
      TRUST_FORWARDED_HEADERS: "true"

    # Every host path derives from DISK, and DISK is written in the
    # fail-closed ${VAR:?message} form on purpose: an unset or misspelled
    # DISK stops the deployment instead of landing five bind mounts
    # somewhere plausible. Docker creates a missing bind-mount source, so
    # a fallback default here would put the backup root on the OS disk and
    # the config file would be created as a directory, which is the one
    # failure this profile exists to make impossible.
    volumes:
      - ${DISK:?set DISK in backup-manager.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backup-manager/state:/data/state
      - ${DISK:?set DISK in backup-manager.env to your /srv/dev-disk-by-uuid-UUID path}/backups/backup-manager:/data/backups
      # A writable directory holding config.yaml (issue #196): the
      # engine creates and atomically replaces that file, and its
      # ssh_keys/ and known_hosts.d/ stores are siblings of it.
      - ${DISK:?set DISK in backup-manager.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backup-manager/config:/etc/backup-manager/config
      - ${DISK:?set DISK in backup-manager.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backup-manager/secrets/id_ed25519:/etc/backup-manager/id_ed25519:ro
      - ${DISK:?set DISK in backup-manager.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backup-manager/secrets/known_hosts:/etc/backup-manager/known_hosts:ro

    restart: unless-stopped
    networks:
      - internal

  # The Web UI: the shared static bundle plus a reverse proxy to the
  # engine. The only container with a published port, and the only URL an
  # operator ever opens. OMV has no navigation entry for it, by design;
  # see README.md.
  backup-manager-ui:
    image: ${IMAGE:-ghcr.io/spdrman/backup-manager:1.0.0}
    command: ["/backup-manager-web", "serve-ui", "--profile=openmediavault"]

    depends_on:
      backup-manager:
        condition: service_healthy

    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=${PUID:-1000},gid=${PGID:-100}

    environment:
      TMPDIR: "/tmp"
      LISTEN_ADDR: ":8080"
      UPSTREAM_ADDR: "http://backup-manager:8080"
      # The per-provider UI bundles the canonical image carries. With
      # `--profile=openmediavault` selected above, the bundle served is
      # /ui/bundles/openmediavault, so an operator who installed through this
      # platform's own mechanism sees that platform's bridge rather than
      # being told this is a generic Docker deployment (issue #180).
      UI_ROOT: "/ui/bundles"

    # No volumes at all: this container never reads config.yaml, the SSH
    # key, known_hosts, or either data directory. Every persistent path in
    # this profile is a bind mount to a host path you chose, so there is
    # no named volume for `docker compose down -v` to reach.

    # Overrides the image's own HEALTHCHECK, which runs
    # `/backup-manager status` and needs a config file and a state
    # database this container does not have. Without this override the
    # container runs correctly and reports unhealthy forever.
    healthcheck:
      test: ["CMD", "/backup-manager-web", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    ports:
      - "${WEB_PORT:-8080}:8080"

    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
