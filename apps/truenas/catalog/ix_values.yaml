# Defaults for every question in questions.yaml. distribution/packaging
# fails the build if a question has no default here, or if this file
# declares a value no question asks for.
image:
  reference: "ghcr.io/spdrman/rclone-manager:0.3.3"

storage:
  state:
    hostPath: "/mnt/tank/rclone-manager/state"
  backups:
    hostPath: "/mnt/tank/rclone-manager/backups"
  configDir:
    hostPath: "/mnt/tank/rclone-manager/config"
  sshKey:
    hostPath: "/mnt/tank/rclone-manager/secrets/id_ed25519"
  knownHosts:
    hostPath: "/mnt/tank/rclone-manager/secrets/known_hosts"

network:
  webPort: 8080

runtime:
  puid: 568
  pgid: 568
  timezone: "UTC"
