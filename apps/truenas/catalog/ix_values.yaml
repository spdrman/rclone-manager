# Defaults for every question in questions.yaml. distribution/packaging
# fails the build if a question has no default here, or if this file
# declares a value no question asks for.
image:
  reference: "ghcr.io/spdrman/backupd:0.4.0"

storage:
  state:
    hostPath: "/mnt/tank/backupd/state"
  backups:
    hostPath: "/mnt/tank/backupd/backups"
  configDir:
    hostPath: "/mnt/tank/backupd/config"
  sshKey:
    hostPath: "/mnt/tank/backupd/secrets/id_ed25519"
  knownHosts:
    hostPath: "/mnt/tank/backupd/secrets/known_hosts"

network:
  webPort: 8080

runtime:
  puid: 568
  pgid: 568
  timezone: "UTC"
