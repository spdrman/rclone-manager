# The TrueNAS install wizard for Backup Manager.
#
# Every variable here is consumed by templates/docker-compose.yaml and
# given a default in ix_values.yaml. distribution/packaging checks that
# correspondence in both directions on every commit, because a question
# nothing reads and a template value nothing asks for are the two ways a
# catalog entry silently installs wrong.
#
# The defaults assume a pool named "tank" and TrueNAS's own apps account
# (568:568). Both are meant to be changed at install time.
groups:
  - name: Image
    description: Which canonical image to deploy.
  - name: Storage
    description: >-
      Host paths on the NAS. Private application state and the user backup
      root are separate security domains, so the state, config and secrets
      paths must never sit inside the backup root.
  - name: Network
    description: The port the Web UI is published on.
  - name: Runtime
    description: The account the containers run as, and the timezone retention is evaluated in.

questions:
  - variable: image
    label: Image
    group: Image
    schema:
      type: dict
      attrs:
        - variable: reference
          label: Canonical image reference
          description: >-
            The exact canonical OCI image. Every provider package in this
            project deploys this same reference; change it only to point
            at your own registry or a locally loaded tag.
          schema:
            type: string
            required: true
            default: "ghcr.io/spdrman/backup-manager:0.3.0"

  - variable: storage
    label: Storage
    group: Storage
    schema:
      type: dict
      attrs:
        - variable: state
          label: Application state
          schema:
            type: dict
            attrs:
              - variable: hostPath
                label: State dataset
                description: >-
                  Holds the SQLite catalog and the local-authentication
                  administrator record. Must exist, and must be owned by
                  the uid/gid below, before first start.
                schema:
                  type: hostpath
                  required: true
                  default: "/mnt/tank/backup-manager/state"
        - variable: backups
          label: Backup root
          schema:
            type: dict
            attrs:
              - variable: hostPath
                label: Backups dataset
                description: >-
                  Where retained artifacts land. Keep this separate from
                  the state, config and secrets paths: no key material or
                  authentication state may ever live inside it.
                schema:
                  type: hostpath
                  required: true
                  default: "/mnt/tank/backup-manager/backups"
        # RENAMED from "config" on purpose (issue #196). TrueNAS carries
        # an installed application's answered values forward across an
        # upgrade, so keeping the identifier would have kept a Phase 4
        # answer of /mnt/POOL/backup-manager/config/config.yaml and bind
        # mounted that FILE at /etc/backup-manager/config, where --config
        # then resolves to .../config/config.yaml and the engine
        # crash-loops with "not a directory" — a message naming neither
        # the mount nor the migration. A new identifier has no answer to
        # carry forward, so the wizard asks again.
        - variable: configDir
          label: Configuration directory
          schema:
            type: dict
            attrs:
              - variable: hostPath
                label: Directory holding config.yaml
                description: >-
                  Mounted WRITABLE, and it is a directory rather than the
                  file inside it. config.yaml lives here, and so do the
                  engine's two on-demand stores, ssh_keys/ and
                  known_hosts.d/. Adding a backup set, saving settings and
                  first-run setup all replace config.yaml through a temp
                  file created in this directory, so a read-only
                  single-file mount silently disables every one of them.
                  The directory may be empty on a fresh install.
                schema:
                  type: hostpath
                  required: true
                  default: "/mnt/tank/backup-manager/config"
        - variable: sshKey
          label: SFTP private key
          schema:
            type: dict
            attrs:
              - variable: hostPath
                label: Private key file
                description: >-
                  Mounted read-only. Keep it at mode 0600 on the host. It
                  is never baked into the image and never copied anywhere.
                schema:
                  type: hostpath
                  required: true
                  default: "/mnt/tank/backup-manager/secrets/id_ed25519"
        - variable: knownHosts
          label: Pinned known_hosts
          schema:
            type: dict
            attrs:
              - variable: hostPath
                label: known_hosts file
                description: >-
                  Mounted read-only. Verify the remote's host-key
                  fingerprint out of band before trusting this file.
                schema:
                  type: hostpath
                  required: true
                  default: "/mnt/tank/backup-manager/secrets/known_hosts"

  - variable: network
    label: Network
    group: Network
    schema:
      type: dict
      attrs:
        - variable: webPort
          label: Web UI port
          description: >-
            The only published port. The engine container publishes
            nothing and is reachable only from the Web UI container.
          schema:
            type: int
            required: true
            default: 8080

  - variable: runtime
    label: Runtime
    group: Runtime
    schema:
      type: dict
      attrs:
        - variable: puid
          label: User ID
          description: >-
            Must already own the state and backups datasets. 568 is
            TrueNAS's own apps account.
          schema:
            type: int
            required: true
            default: 568
        - variable: pgid
          label: Group ID
          schema:
            type: int
            required: true
            default: 568
        - variable: timezone
          label: Timezone
          description: >-
            Retention is evaluated against calendar boundaries, so this
            is not cosmetic: leave it at the image's UTC default and the
            days you reason about and the days the engine applies are
            silently different. Use the NAS's own zone, in tz database
            form (for example America/Toronto).
          schema:
            type: string
            required: true
            default: "UTC"
