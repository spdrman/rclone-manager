# An ordinary TLS + HTTP/2 reverse proxy in front of `backupd-web serve-ui`.
#
# Nothing here is tuned to provoke backupd#730. It is the shape an
# operator's front door has: terminate TLS, speak HTTP/2 to the browser,
# forward to the UI host over HTTP/1.1, and set the X-Forwarded-* headers
# the engine already trusts (TRUST_FORWARDED_HEADERS=true, PUBLIC_BASE_URL
# is https in this mode). The one deliberate choice is `proxy_buffering
# off`, because a streaming front proxy is the common operator setup and is
# the arrangement most likely to pass an upstream framing quirk through to
# the browser rather than absorb it — which is exactly the class of fault
# #730 looks like (a throw before any response, not an HTTP error status).

worker_processes 1;
events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr info;

  server {
    listen 443 ssl;
    http2  on;
    server_name backupd;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    # Large enough that the authenticated /api/v1/activity payload does not
    # trip a header-size limit before the bug it is meant to reveal.
    large_client_header_buffers 4 16k;

    # Docker's embedded DNS. Resolving the upstream at request time (via a
    # variable in proxy_pass) rather than at load time means this proxy does
    # not need serve-ui to exist when it starts or when the image's
    # `nginx -t` runs, and it survives serve-ui getting a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
      # serve-ui, by the edge-network alias three-machine-web-ui.sh gives it
      # when --front-proxy-tls moves it off the "backupd" name so this
      # proxy can take it. The variable is what defers the DNS to runtime.
      set $backend "origin:8080";
      proxy_pass http://$backend;
      proxy_http_version 1.1;

      # Do not absorb the upstream's framing: stream it straight through to
      # the h2 downstream, the way an operator's proxy typically would.
      proxy_buffering off;
      proxy_request_buffering off;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;

      # Clear the hop-by-hop upgrade path unless the upstream asks for it,
      # so an idle Connection header is not forwarded into HTTP/2.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "";

      proxy_read_timeout    300s;
      proxy_connect_timeout 10s;
    }
  }
}
