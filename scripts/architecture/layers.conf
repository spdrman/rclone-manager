# The three-layer manifest (issue #165, EPIC B #81's standing constraint
# "one runtime, thin adapters").
#
# Phase 6's claim is that the product is one Go application, one shared
# TypeScript UI, one canonical image and one authoritative Compose
# runtime, with every NAS OS, container manager and app store reduced to a
# thin adapter around it. That claim rests on three boundaries, and before
# this file the repository only had two: core, and "a provider app". The
# middle two of the three were conflated inside apps/<platform>/, and the
# dependency rule named no distribution layer at all.
#
# This file is what makes the three mechanically decidable, so a check can
# answer "which layer is this file in" instead of a reviewer answering it.
# Every checked-in file is classified by exactly one entry (the longest
# matching path prefix wins), and check-layer-manifest.sh fails if any file
# is unclassified or any entry names a path that no longer exists.
# docs/architecture/layers.md is the prose next to it.
#
#   FORMAT: <layer> <kind> <path>
#
#   layer:
#     core           Provider-neutral core, application services, the
#                    /api/v1 host and the shared web UI. Owns lifecycle
#                    state, retention, validation, catalog and backup
#                    policy, and owns them exclusively.
#     platform       Runtime platform behaviour: a profile that legitimately
#                    depends on the host (a trusted native auth gateway, a
#                    notification bridge, a launch/navigation bridge,
#                    platform capability reporting). Depends on core/app
#                    CONTRACTS ONLY, and never alters backup lifecycle
#                    semantics.
#     distribution   Packaging, metadata, templates and store presentation.
#                    Changes only how the same runtime is installed and
#                    presented. May never fork backup behaviour, API
#                    semantics, web application logic, retention logic,
#                    validation rules or database truth.
#     infrastructure Not product code: documentation, build and gate
#                    scripting, repository configuration. Listed rather
#                    than silently excluded, so the completeness check has
#                    no blind spot to hide a new product directory in.
#
#   kind (distribution only; "-" everywhere else):
#     adapter        Part of the distribution ADAPTER tree. #81's dependency
#                    rule says the core and generic application must build
#                    and pass tests with this tree deleted, and
#                    verify-core-without-distribution.sh proves it by
#                    deleting exactly these paths.
#     canonical      Distribution-layer, but part of the canonical runtime
#                    and its shared metadata rather than any one adapter.
#                    Adapters derive from these; they are not deleted by the
#                    adapter-deletion proof, because #81's claim is about
#                    the adapter tree, not about the canonical runtime the
#                    adapters wrap.
#
# Ordering does not matter; specificity does. "distribution adapter
# apps/unraid/template" wins over "platform - apps/unraid/frontend" for a
# file under the former, because it is the longer matching prefix.

# ---------------------------------------------------------------- core ---
# core/ is the provider-neutral engine and imports nothing from apps/ or
# distribution/. That was already CI-enforced before Phase 6 and stays so.
core            -           core

# The authoritative /api/v1 contract (issue #166) and the bindings
# generated from it. #81's hierarchy puts the versioned provider-neutral API
# contract at position 2, above the shared UI and below the core services,
# so it is core-layer: a runtime profile may not change what an endpoint
# means, and a distribution adapter may not fork API semantics at all. The
# two generated bindings live with the code that consumes them
# (apps/common/webhost/apicontract and ui/shared/src/api/generated), both of
# which are already classified core by the entries around this one.
core            -           api

# The shared React/TypeScript UI. One web UI, no provider-specific copies.
core            -           ui/shared

# The /api/v1 host, the reusable authentication service and the shared CSRF
# primitive. These are provider-neutral application services that happen to
# live under apps/common/ for historical reasons; they are core-layer, and
# the dependency check holds them to it.
core            -           apps/common/webhost
core            -           apps/common/auth
core            -           apps/common/csrf

# The PlatformCapabilities/PlatformAdapter contract and the generic sink
# that consumes it. #81's dependency rule reads "platform ───► app/core
# contracts only", which means the contract itself belongs to core, not to
# any platform. A runtime profile implements this; it does not own it.
core            -           apps/common/platform

core            -           apps/common/go.mod
core            -           apps/common/go.sum

# ------------------------------------------------------------ platform ---
# Runtime profiles. Each of these is a host-specific bridge: a capability
# declaration, a bootstrap, and at most an authentication bridge. None of
# them may hold lifecycle, retention, validation, catalog or backup policy,
# which is what check-layer-ownership.sh enforces.
platform        -           apps/generic
platform        -           apps/ugos
platform        -           apps/synology/frontend
platform        -           apps/truenas/frontend
platform        -           apps/unraid/frontend
platform        -           apps/openmediavault/frontend
platform        -           apps/proxmox/frontend

# The cross-provider bridge conformance suite: the one place in the
# repository that imports every provider's platform.ts. It tests the
# platform layer, so it belongs to it, and it is deliberately outside
# ui/shared so deleting a provider cannot break the shared UI's own build.
platform        -           apps/common/tests

# -------------------------------------------------------- distribution ---
# The canonical runtime the adapters wrap: the image definition, the
# authoritative Compose runtime and the release manifest. #167 owns
# relocating these into distribution/compose/; the layer they belong to
# does not change when they move.
distribution    canonical   container

# Shared distribution metadata (canonical.json, the single source every
# provider package agrees with) plus the conformance suite that holds the
# packages to it, including Phase 4's per-capability matrix with its
# completeness and staleness guards. Its own module, so the distribution
# layer is a thing that can be built, tested and reasoned about on its own.
distribution    canonical   distribution

# The release compliance bundle (#88/B5.2): the licence, the generated
# third-party NOTICE, the SBOM, the licence inventory, the checksum
# manifest and the provenance record. This is exactly what release.yml
# uploads as the compliance bundle alongside container/release-manifest.json
# above, which is already canonical here, so the four move as one. Canonical
# rather than adapter: it describes the one canonical runtime, not any
# single target, and deleting the adapter tree must not delete it.
# distribution/cmd/provenance generates it and distribution/packaging holds
# the tree to it.
distribution    canonical   LICENSE
distribution    canonical   NOTICE
distribution    canonical   provenance

# The adapter tree. Everything here is installation metadata, host paths,
# templates, store presentation or packaging tooling for one target.
distribution    adapter     apps/truenas/catalog
distribution    adapter     apps/truenas/compose
distribution    adapter     apps/truenas/README.md
distribution    adapter     apps/unraid/template
distribution    adapter     apps/unraid/README.md
# An Unraid WebUI store descriptor sitting inside the runtime-profile
# directory. Classified for what it is rather than for where it sits; #169
# relocates it (docs/architecture/layers.md records the mapping).
distribution    adapter     apps/unraid/frontend/webui.json
distribution    adapter     apps/openmediavault/compose
distribution    adapter     apps/openmediavault/README.md
distribution    adapter     apps/proxmox/compose
distribution    adapter     apps/proxmox/README.md
# Proxmox deployment documentation, in the frontend directory for the same
# historical reason as webui.json above.
distribution    adapter     apps/proxmox/frontend/deployment.md
# The Synology package: spk/ builds the .spk and cmd/spkctl drives it. That
# is packaging tooling, not runtime behaviour, so the whole Go module minus
# its frontend bridge is adapter-layer.
# The Synology Container Manager project (#169): the canonical-runtime
# path DSM gets alongside the .spk, and metadata like every other adapter.
distribution    adapter     apps/synology/compose
distribution    adapter     apps/synology/spk
distribution    adapter     apps/synology/cmd
distribution    adapter     apps/synology/go.mod
distribution    adapter     apps/synology/README.md
# Host installation tooling for UGREEN's own CLI. Installation tooling for
# one target is the definition of an adapter.
distribution    adapter     tools/ugcli-install

# ------------------------------------------------------ infrastructure ---
infrastructure  -           docs
infrastructure  -           scripts
infrastructure  -           .github
infrastructure  -           .husky
infrastructure  -           README.md
infrastructure  -           go.work
infrastructure  -           .gitignore
infrastructure  -           .golangci.yml
infrastructure  -           .dockerignore
